<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body{
            background:#111;
            color:white;
            font-family:Arial;
            text-align:center;
            padding-top:100px;
        }

        input{
            padding:10px;
            width:300px;
            margin:10px;
            border-radius:10px;
            border:none;
        }

        button{
            padding:10px 20px;
            background:#e50914;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        .error{
            color:red;
        }

    </style>

</head>

<body>

    <h1>Login</h1>

    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <br>

        <button type="submit">
            Login
        </button>

    </form>

</body>

</html>
